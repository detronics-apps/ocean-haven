		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #102c42;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>
/* The page never scrolls or zooms (an iPhone could leave it zoomed or scrolled after turning,
   the game showing too low and to the right with its bottom cut off): the game fills it all. */
html, body { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
	overscroll-behavior: none; -webkit-text-size-adjust: 100%; touch-action: none; }
#canvas { position: fixed; left: 0; top: 0; }

<meta name="mobile-web-app-capable" content="yes">
<style>
/* Loading: one ocean colour fills the whole screen; BlueHaven's title (the boot splash, see-through
   round its words) in the middle, and just under it a bar with the game's turtle swimming along it. */
#status { background-color: #102c42 !important; }
#status-progress { display: none !important; }
#bh-loader { position: absolute; left: 50%; transform: translateX(-50%); width: min(70vw, 360px); height: 40px; }
#bh-track { position: absolute; left: 0; right: 0; top: 24px; height: 6px; border-radius: 3px; background: rgba(160, 220, 240, 0.18); }
#bh-fill { position: absolute; left: 0; top: 24px; height: 6px; border-radius: 3px; background: #4fd1c5; width: 0; }
#bh-turtle { position: absolute; top: 4px; width: 39px; height: 33px; margin-left: -30px; image-rendering: pixelated; }
</style>
<script>
window.addEventListener('DOMContentLoaded', function () {
	var status = document.getElementById('status');
	var bar = document.getElementById('status-progress');
	if (!status) return;
	// Where the title's line ends on the 960 x 540 splash (tools/make_splash.py prints it).
	var SUB_BOTTOM = 306;
	var box = document.createElement('div');
	box.id = 'bh-loader';
	box.innerHTML = '<div id=bh-track></div><div id=bh-fill></div><img id=bh-turtle alt=>';
	status.appendChild(box);
	var fill = document.getElementById('bh-fill'), turtle = document.getElementById('bh-turtle');
	turtle.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAAWCAYAAADeiIy1AAAAAXNSR0IArs4c6QAAAWlJREFUSIljZCATqDjL/0cXu7P3ISMu9SzkWqJtLo1N6j8uy5jIsYgcgOEj9CDBFxxkW4QtSLjufcOIC4Z73xgYzDEN47r3jTiLYOD3gSdwtowkJ1aNyGpQ1Yr+v3T/NUYo4EwMBgZSOF2HC1y48AynHIpF0Pj4rwblKyhIMDAwMDA8ePACpwHoalj1hRiM9YXgwX12w01GDIsYGKDhjCW4YAYiA2wOsPHSQBf6f3bDTUZ48lZxlv+v4iz//5sSF07XkwLWTziKwmeBWYKc2mARjS/IYACXmsACaxQ+fTMsLBHABClJDDCwfsJRFF/BEwOsBNBTFP2PLTGQCtCDDiPVfVPiYmD4jlkYEBNfDAwMDEe23UDhY03esERBSWL4ffEdA0klA75cTg7AahGrgwycfX/5bawaFSNVMcTuL7+N1TcYFqGnPgYGBoY7WDRiq10ZGKDxex+ruzB9RK36Bx3QLcOS7XpSGycA/euRH5Lk7I0AAAAASUVORK5CYII=';
	var start = performance.now(), shown = 0;
	function frame(now) {
		if (!document.body.contains(box)) return;
		// Just under the title's line, wherever the splash sits (it's fitted to the screen).
		var scale = Math.min(window.innerWidth / 960, window.innerHeight / 540);
		box.style.top = Math.round(window.innerHeight / 2 + (SUB_BOTTOM - 270) * scale + 12) + 'px';
		var p = (bar && bar.max > 0 && bar.hasAttribute('value')) ? bar.value / bar.max : 1 - Math.exp(-(now - start) / 6000);
		shown += (Math.min(p, 1) - shown) * 0.08;
		var width = box.clientWidth * shown;
		fill.style.width = width + 'px';
		// The turtle paddles at the front of the bar (a little bob and sway).
		turtle.style.left = Math.max(width, 18) + 'px';
		turtle.style.transform = 'translateY(' + (Math.sin(now / 160) * 1.5).toFixed(1) + 'px) rotate(' + (Math.sin(now / 320) * 6).toFixed(1) + 'deg)';
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
});
</script>

<script>
// Sound plays like a music app's: an iPhone's silent switch doesn't mute it (the game has its
// own speaker button to turn the sound off).
if (navigator.audioSession) navigator.audioSession.type = 'playback';
// The installed app caches the game. A new version that has already downloaded is switched
// to straight away when the app opens; one that downloads while you play waits until you come
// back to the app (the game saves when you leave it), so loading or playing is never cut off.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(function (reg) {
	if (!reg) return;
	function take(worker) { if (worker && navigator.serviceWorker.controller) worker.postMessage('update'); }
	take(reg.waiting);
	document.addEventListener('visibilitychange', function () {
		if (document.visibilityState === 'visible') take(reg.waiting);
	});
	reg.update();
});
// iPhone home-screen apps can keep the old size for a moment after the phone is turned, so the
// bottom of the game (minimap, action buttons) ends up off screen: ask the game to measure the
// window again a few times after every turn or resize.
(function () {
	function remeasure() {
		[60, 250, 600, 1200].forEach(function (ms) {
			setTimeout(function () { window.scrollTo(0, 0); window.dispatchEvent(new Event('resize')); }, ms);
		});
	}
	// An iPhone home-screen app can also keep the page where it sat before the turn (the game
	// pushed down and right by the old status bar and notch): setting the viewport again makes
	// it lay the page out afresh.
	var view = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no';
	function relayout() {
		document.querySelectorAll('meta[name=viewport]').forEach(function (m) {
			m.setAttribute('content', view + ', shrink-to-fit=no');
			setTimeout(function () { m.setAttribute('content', view); }, 40);
		});
	}
	window.addEventListener('orientationchange', function () { relayout(); remeasure(); });
	window.addEventListener('resize', function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
	if (window.visualViewport) window.visualViewport.addEventListener('resize', function () {
		if (Math.abs(window.visualViewport.height - window.innerHeight) > 1) remeasure();
	});
	document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') remeasure(); });
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5611044,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
