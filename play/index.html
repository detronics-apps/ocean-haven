<!DOCTYPE html>
<html lang="en">
	<head>

		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>BlueHaven</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #102c42;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>
/* The page never scrolls or zooms (an iPhone could leave it zoomed or scrolled after turning,
   the game showing too low and to the right with its bottom cut off): the game fills it all. */
html, body { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
	overscroll-behavior: none; -webkit-text-size-adjust: 100%; touch-action: none; }
#canvas { position: fixed; left: 0; top: 0; }

#status { background-color: #102c42 !important; }
#status-progress { display: none !important; }
#bh-loader { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(40vmin, 240px); height: auto; image-rendering: pixelated; }

<script>
// Sound plays like a music app's: an iPhone's silent switch doesn't mute it (the game has its
// own speaker button to turn the sound off).
if (navigator.audioSession) navigator.audioSession.type = 'playback';
// The installed app caches the game. A new version that has already downloaded is switched
// to straight away when the app opens; one that downloads while you play waits until you come
// back to the app (the game saves when you leave it), so loading or playing is never cut off.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(function (reg) {
	if (!reg) return;
	function take(worker) { if (worker && navigator.serviceWorker.controller) worker.postMessage('update'); }
	take(reg.waiting);
	document.addEventListener('visibilitychange', function () {
		if (document.visibilityState === 'visible') take(reg.waiting);
	});
	reg.update();
});
// iPhone home-screen apps can keep the old size for a moment after the phone is turned, so the
// bottom of the game (minimap, action buttons) ends up off screen: ask the game to measure the
// window again a few times after every turn or resize.
(function () {
	function remeasure() {
		[60, 250, 600, 1200].forEach(function (ms) {
			setTimeout(function () { window.scrollTo(0, 0); window.dispatchEvent(new Event('resize')); }, ms);
		});
	}
	// An iPhone home-screen app can also keep the page where it sat before the turn (the game
	// pushed down and right by the old status bar and notch): setting the viewport again makes
	// it lay the page out afresh.
	var view = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no';
	function relayout() {
		document.querySelectorAll('meta[name=viewport]').forEach(function (m) {
			m.setAttribute('content', view + ', shrink-to-fit=no');
			setTimeout(function () { m.setAttribute('content', view); }, 40);
		});
	}
	window.addEventListener('orientationchange', function () { relayout(); remeasure(); });
	window.addEventListener('resize', function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
	if (window.visualViewport) window.visualViewport.addEventListener('resize', function () {
