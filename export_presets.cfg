[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-title\" content=\"BlueHaven\">
<script>
// The installed app caches the game; when a new version has downloaded, switch to it now
// (reloads the page) instead of waiting for the app to be fully closed.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(function (reg) {
	if (!reg) return;
	function take(worker) { if (worker && navigator.serviceWorker.controller) worker.postMessage('update'); }
	take(reg.waiting);
	reg.addEventListener('updatefound', function () {
		var worker = reg.installing;
		worker.addEventListener('statechange', function () { if (worker.state === 'installed') take(worker); });
	});
	reg.update();
});
</script>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/ui/app_icon_144.png"
progressive_web_app/icon_180x180="res://assets/ui/app_icon_180.png"
progressive_web_app/icon_512x512="res://assets/ui/app_icon_512.png"
progressive_web_app/background_color=Color(0.12, 0.23, 0.3, 1)
