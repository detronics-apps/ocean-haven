html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no\">
<style>
/* The page never scrolls or zooms (an iPhone could leave it zoomed or scrolled after turning,
   the game showing too low and to the right with its bottom cut off): the game fills it all. */
html, body { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
	overscroll-behavior: none; -webkit-text-size-adjust: 100%; touch-action: none; }
#canvas { position: fixed; left: 0; top: 0; }
</style>
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<style>
/* Loading: one ocean colour fills the whole screen; a little globe turning above BlueHaven's title
   (the boot splash, see-through round its words), and just under it a bar with the game's turtle
   swimming along it. */
#status { background-color: #102c42 !important; }
#status-progress { display: none !important; }
#bh-loader { position: absolute; left: 50%; transform: translateX(-50%); width: min(70vw, 360px); height: 40px; }
#bh-track { position: absolute; left: 0; right: 0; top: 24px; height: 6px; border-radius: 3px; background: rgba(160, 220, 240, 0.18); }
#bh-fill { position: absolute; left: 0; top: 24px; height: 6px; border-radius: 3px; background: #4fd1c5; width: 0; }
#bh-globe { position: absolute; left: 50%; transform: translateX(-50%); image-rendering: pixelated; }
#bh-turtle { position: absolute; top: 10px; width: 39px; height: 33px; margin-left: -30px; image-rendering: pixelated; }
</style>
<script>
window.addEventListener('DOMContentLoaded', function () {
	var status = document.getElementById('status');
	var bar = document.getElementById('status-progress');
	if (!status) return;
	// Where the title's line ends on the 960 x 540 splash (tools/make_splash.py prints it).
	var SUB_BOTTOM = 306, TITLE_TOP = 136;
	var box = document.createElement('div');
	box.id = 'bh-loader';
	box.innerHTML = '<div id=bh-track></div><div id=bh-fill></div><img id=bh-turtle alt=>';
	status.appendChild(box);
	var fill = document.getElementById('bh-fill'), turtle = document.getElementById('bh-turtle');
	// The globe above the title: a little world turning, drawn in pixels (land seeded, so it's
	// the same every time; soft light from the top left).
	var R = 25, D = 2 * R + 1, MW = 64, MH = 32, land = [], seed = 11;
	var globe = document.createElement('canvas');
	globe.id = 'bh-globe'; globe.width = D; globe.height = D;
	status.appendChild(globe);
	var g = globe.getContext('2d'), pixels = g.createImageData(D, D), spin = 0;
	function rand() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
	var blobs = [];
	for (var b = 0; b < 9; b++) blobs.push([rand() * MW, 6 + rand() * (MH - 12), 3 + rand() * 6]);
	for (var y = 0; y < MH; y++) for (var x = 0; x < MW; x++) {
		var on = false;
		for (var k = 0; k < blobs.length; k++) {
			var dx = Math.min(Math.abs(x - blobs[k][0]), MW - Math.abs(x - blobs[k][0])), dy = y - blobs[k][1];
			if (dx * dx + dy * dy * 2.2 < blobs[k][2] * blobs[k][2]) on = true;
		}
		land.push(on);
	}
	function drawGlobe() {
		spin += 0.0025;
		for (var py = -R; py <= R; py++) for (var px = -R; px <= R; px++) {
			var i = ((py + R) * D + (px + R)) * 4, nx = px / R, ny = py / R, d = nx * nx + ny * ny;
			if (d > 1) { pixels.data[i + 3] = 0; continue; }
			var nz = Math.sqrt(1 - d), lat = Math.asin(ny), lon = Math.asin(nx / Math.max(Math.cos(lat), 0.01)) + spin * 6.283;
			var mx = Math.floor(((lon / 6.283) % 1 + 1) % 1 * MW), my = Math.floor((lat / 3.1416 + 0.5) * (MH - 1));
			var light = Math.max(0, -0.45 * nx - 0.35 * ny + 0.82 * nz);
			var shade = 0.62 + Math.round(light * 4) / 4 * 0.4;  // a few steps, like pixel art
			var c = land[my * MW + mx] ? [92, 170, 90] : [42, 128, 176];
			if (land[my * MW + mx] && (my < 4 || my > MH - 5)) c = [230, 240, 245];
			if (d > 0.86) shade *= 0.8;  // a darker rim
			pixels.data[i] = c[0] * shade; pixels.data[i + 1] = c[1] * shade; pixels.data[i + 2] = c[2] * shade; pixels.data[i + 3] = 255;
		}
		g.putImageData(pixels, 0, 0);
	}
	turtle.src = 'data:image/png;base64,';
	var start = performance.now(), shown = 0;
	function frame(now) {
		if (!document.body.contains(box)) return;
		// Just under the title's line, wherever the splash sits (it's fitted to the screen).
		var scale = Math.min(window.innerWidth / 960, window.innerHeight / 540);
		box.style.top = Math.round(window.innerHeight / 2 + (SUB_BOTTOM - 270) * scale + 12) + 'px';
		// The globe just above the title, as big as the space there allows.
		var titleTop = window.innerHeight / 2 + (TITLE_TOP - 270) * scale;
		var size = Math.max(36, Math.min(112, titleTop - 24));
		globe.style.width = globe.style.height = Math.round(size) + 'px';
		globe.style.top = Math.round(Math.max(8, titleTop - size - 10)) + 'px';
		drawGlobe();
		var p = (bar && bar.max > 0 && bar.hasAttribute('value')) ? bar.value / bar.max : 1 - Math.exp(-(now - start) / 6000);
		shown += (Math.min(p, 1) - shown) * 0.08;
		var width = box.clientWidth * shown;
		fill.style.width = width + 'px';
		// The turtle paddles at the front of the bar (a little bob and sway).
		turtle.style.left = Math.max(width, 18) + 'px';
		turtle.style.transform = 'translateY(' + (Math.sin(now / 160) * 1.5).toFixed(1) + 'px) rotate(' + (Math.sin(now / 320) * 6).toFixed(1) + 'deg)';
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
});
</script>
<meta name=\"apple-mobile-web-app-title\" content=\"BlueHaven\">
<script>
// Sound plays like a music app's: an iPhone's silent switch doesn't mute it (the game has its
// own speaker button to turn the sound off).
if (navigator.audioSession) navigator.audioSession.type = 'playback';
// The installed app caches the game. A new version that has already downloaded is switched
// to straight away when the app opens; one that downloads while you play waits until you come
// back to the app (the game saves when you leave it), so loading or playing is never cut off.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(function (reg) {
	if (!reg) return;
	function take(worker) { if (worker && navigator.serviceWorker.controller) worker.postMessage('update'); }
	take(reg.waiting);
	document.addEventListener('visibilitychange', function () {
		if (document.visibilityState === 'visible') take(reg.waiting);
	});
	reg.update();
});
// iPhone home-screen apps can keep the old size for a moment after the phone is turned, so the
// bottom of the game (minimap, action buttons) ends up off screen: ask the game to measure the
// window again a few times after every turn or resize.
(function () {
	function remeasure() {
		[60, 250, 600, 1200].forEach(function (ms) {
			setTimeout(function () { window.scrollTo(0, 0); window.dispatchEvent(new Event('resize')); }, ms);
		});
	}
	// An iPhone home-screen app can also keep the page where it sat before the turn (the game
	// pushed down and right by the old status bar and notch): setting the viewport again makes
	// it lay the page out afresh.
	var view = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no';
	function relayout() {
		document.querySelectorAll('meta[name=viewport]').forEach(function (m) {
			m.setAttribute('content', view + ', shrink-to-fit=no');
			setTimeout(function () { m.setAttribute('content', view); }, 40);
		});
	}
	window.addEventListener('orientationchange', function () { relayout(); remeasure(); });
	window.addEventListener('resize', function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
	if (window.visualViewport) window.visualViewport.addEventListener('resize', function () {
		if (Math.abs(window.visualViewport.height - window.innerHeight) > 1) remeasure();
	});
	document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') remeasure(); });
})();
</script>"
