  <rect x="6" y="3" width="4" height="2" fill="#4f8f4a"/>
  <rect x="7" y="5" width="2" height="8" fill="#6a9a3a"/>
  <rect x="7" y="13" width="2" height="2" fill="#8a6a3a"/>
</svg>
