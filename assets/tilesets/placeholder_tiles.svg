<svg xmlns="http://www.w3.org/2000/svg" width="224" height="32" viewBox="0 0 224 32" shape-rendering="crispEdges">
  <!-- Placeholder 32x32 terrain tiles, one per column (see placeholder_tileset.tres). Plain ground only:
       coral, kelp and mangroves will be plants on top. -->
  <!-- 0: shallow water -->
  <rect x="0" y="0" width="32" height="32" fill="#4c838b"/>
  <rect x="1" y="1" width="30" height="30" fill="#528b93"/>
  <!-- 1: sand -->
  <rect x="32" y="0" width="32" height="32" fill="#d8c792"/>
  <rect x="33" y="1" width="30" height="30" fill="#e6d5a4"/>
  <!-- 2: grass -->
  <rect x="64" y="0" width="32" height="32" fill="#728c48"/>
  <rect x="65" y="1" width="30" height="30" fill="#7f9a52"/>
  <!-- 3: rock -->
  <rect x="96" y="0" width="32" height="32" fill="#70797f"/>
  <rect x="97" y="1" width="30" height="30" fill="#7c858c"/>
  <!-- 4: ice -->
  <rect x="128" y="0" width="32" height="32" fill="#d7e5ec"/>
  <rect x="129" y="1" width="30" height="30" fill="#e8f1f5"/>
  <!-- 5: mud -->
  <rect x="160" y="0" width="32" height="32" fill="#6f5536"/>
  <rect x="161" y="1" width="30" height="30" fill="#7a5e3c"/>
  <!-- 6: mid water -->
  <rect x="192" y="0" width="32" height="32" fill="#375f72"/>
  <rect x="193" y="1" width="30" height="30" fill="#3a6478"/>
</svg>
